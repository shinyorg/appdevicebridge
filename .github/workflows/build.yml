name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - dev
    - preview
    - v*
    paths-ignore:
      - 'skills/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.400'
          workloads: maui, macos

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release -property:PublicRelease=true

    # Before anything is published. Debug, so the test build doesn't pack every referenced project a second time. The
    # summary line reports how many were skipped: the remote-caller tests skip on a runner without a LAN address.
    - name: Test
      run: dotnet test tests/Shiny.AppDeviceBridge.Tests/Shiny.AppDeviceBridge.Tests.csproj -property:Configuration=Debug

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'
        retention-days: 5

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      run: dotnet nuget push **\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

  # @shinyorg/appdevicebridge: compiled JS and .d.ts, versioned by nbgv like the NuGet packages. Published with npm trusted
  # publishing (OIDC), which needs this repository and workflow registered as a trusted publisher on npmjs.com.
  npm:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: clients/typescript

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.400'

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Version
      id: version
      run: |
        dotnet tool install --global nbgv
        version=$(nbgv get-version --variable NpmPackageVersion)
        npm version "$version" --no-git-tag-version --allow-same-version
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Publish
      run: |
        version="${{ steps.version.outputs.version }}"
        if npm view "@shinyorg/appdevicebridge@$version" version > /dev/null 2>&1; then
          echo "$version is already published"
          exit 0
        fi
        if [[ "$version" == *-* ]]; then tag=beta; else tag=latest; fi
        npm publish --tag "$tag"
