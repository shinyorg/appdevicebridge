name: Release

# Push a tag like v4.0.0 (or v4.0.0-beta.1 for a prerelease) to build every package at that version, push them to
# NuGet and publish a GitHub release. Or run it by hand with a version, which creates the v<version> tag on the
# commit it built. The tag is the version - there is nothing to bump in the repo. A suffix after '-' marks both the
# NuGet packages and the GitHub release as prerelease. Runners and toolchain pins match ci.yml - bump them together.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 4.0.0 or 4.0.0-beta.1) - creates the v<version> tag'
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
    - name: Version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION="${GITHUB_REF_NAME#v}"
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Version '$VERSION' must look like 4.0.0 or 4.0.0-beta.1"; exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        if [[ "$VERSION" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

  # Everything but Shiny.AppDeviceBridge.Maps.Valhalla - see ci.yml. Release packs on build (GeneratePackageOnBuild);
  # Version overrides the 0.0.0-dev default in Directory.Build.props.
  build:
    needs: version
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '11.0.100'
          workloads: maui, macos

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release -property:Version=${{ needs.version.outputs.version }}

    # Before anything is published. Debug, so the test build doesn't pack every referenced project a second time.
    - name: Test
      run: dotnet test --project tests/Shiny.AppDeviceBridge.Tests/Shiny.AppDeviceBridge.Tests.csproj -c Debug

    - name: Post Test Results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: 'tests/**/TestResults/**'
        retention-days: 5

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: |
          src/**/bin/Release/*.nupkg
          src/**/bin/Release/*.snupkg
        if-no-files-found: error

  # Only its own package - the projects it references are packed by the build job.
  valhalla:
    needs: version
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '11.0.100'
          workloads: maui

    - name: Build
      run: dotnet build src/Shiny.AppDeviceBridge.Maps.Valhalla/Shiny.AppDeviceBridge.Maps.Valhalla.csproj /restore -m -property:Configuration=Release -property:Version=${{ needs.version.outputs.version }}

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets-valhalla
        path: |
          src/Shiny.AppDeviceBridge.Maps.Valhalla/bin/Release/*.nupkg
          src/Shiny.AppDeviceBridge.Maps.Valhalla/bin/Release/*.snupkg
        if-no-files-found: error

  # Nothing is published until both builds (and the tests) pass.
  publish:
    needs: [ version, build, valhalla ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: write   # creates the GitHub release (and the tag, when run by hand)

    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        pattern: nugets*
        path: artifacts
        merge-multiple: true

    - name: List packages
      run: find artifacts -type f | sort

    - name: NuGet Login (OIDC)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: aritchie

    # NuGet first: the GitHub release only appears once the packages it points at are live. The .snupkg files are
    # pushed alongside their .nupkg. --skip-duplicate so a re-run after a partial failure pushes only what is missing.
    - name: Publish NuGets
      run: >
        find artifacts -name '*.nupkg' -print0 | xargs -0 -I{}
        dotnet nuget push "{}"
        --source https://api.nuget.org/v3/index.json
        --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
        --skip-duplicate

    - name: GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "${{ needs.version.outputs.tag }}"
        --repo "${{ github.repository }}"
        --title "Shiny.AppDeviceBridge ${{ needs.version.outputs.version }}"
        --notes "Release notes: https://shinylib.net/appdevicebridge/release-notes/"
        --generate-notes
        --target "$GITHUB_SHA"
        ${{ needs.version.outputs.prerelease }}

  # only after the packages and the GitHub release are out, so the published skills match a shipped version
  skills:
    needs: publish
    uses: ./.github/workflows/sync-skills.yml
    secrets: inherit
